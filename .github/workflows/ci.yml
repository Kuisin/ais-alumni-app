name: CI

# Runs on PRs and on pushes to dev. The push run matters: the auto-created
# dev → main PR is opened with GITHUB_TOKEN, which does not trigger
# pull_request workflows, so its required check comes from the push run on
# the same commit.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The native app (mobile/, its own pnpm workspace): types and a real
  # Metro bundle for both platforms. Lint runs in `checks` (repo-wide Biome).
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
